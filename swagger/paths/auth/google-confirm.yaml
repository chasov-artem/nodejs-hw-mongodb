tags:
  - Auth
summary: Confirm Google OAuth
operationId: confirmGoogleOAuth
security:
  - bearerAuth: []
description: Confirm Google OAuth
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          code:
            type: string
            description: Authentication code received from Google.
            example: '4/0ARtbsJ...'
responses:
  '200':
    description: Successful authorization through Google.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Login with Google successfully.
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  description: Access token.
                  example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
  '401':
    $ref: '../../components/responses/401.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
