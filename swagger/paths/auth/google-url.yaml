tags:
  - Auth
summary: Get URL for Google OAuth
operationId: getGoogleOAuthURL
security:
  - bearerAuth: []
description: Get URL for Google OAuth
responses:
  '200':
    description: URL successfully generated.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully get Google OAuth URL.
            data:
              type: string
              description: URL для Google OAuth.
              example: 'https://accounts.google.com/o/oauth2/v2/auth?...'
  '404':
    $ref: ../../components/responses/404.yaml
  '500':
    $ref: '../../components/responses/500.yaml'
