tags:
  - Auth
summary: User login.
operationId: loginUser
security:
  - bearerAuth: []
description: User login.
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        properties:
          email:
            type: string
            description: User email.
            example: 'johndoe@mail.com'
          password:
            type: string
            description: User password.
            example: 'password123'
responses:
  '200':
    description: Successfully logged in an user.
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged in an user!
            data:
              type: object
              properties:
                accessToken:
                  type: string
                  description: Access token.
                  example: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'
  '401':
    $ref: '../../components/responses/401.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
