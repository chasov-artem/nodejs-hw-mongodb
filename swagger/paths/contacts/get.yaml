tags:
  - Contacts
summary: Get list of contacts
description: Retrieve a list of contacts with optional pagination, sorting, and filtering.
operationId: getContacts
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    schema:
      type: integer
      minimum: 1
      example: 1
    required: false
    description: The page number for pagination.
  - in: query
    name: perPage
    schema:
      type: integer
      minimum: 1
      example: 10
    required: false
    description: The number of contacts per page for pagination.
  - in: query
    name: sortBy
    schema:
      type: string
      enum: [_id, name, phoneNumber, createdAt, updatedAt]
      example: name
    required: false
    description: The field by which to sort the results.
  - in: query
    name: sortOrder
    schema:
      type: string
      enum: [asc, desc]
      example: asc
    required: false
    description: The order in which to sort the results (ascending or descending).
  - in: query
    name: contactType
    schema:
      type: string
      enum: [work, home, personal]
      example: personal
    required: false
    description: Filter contacts by type.
  - in: query
    name: isFavourite
    schema:
      type: boolean
      example: true
    required: false
    description: Filter contacts by favourite status (true or false).
responses:
  '200':
    description: A list of contacts
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contacts retrieved successfully
            data:
              type: object
              required:
                - items
                - total
                - page
                - perPage
              properties:
                items:
                  type: array
                  items:
                    $ref: '../../components/schemas/contact.yaml'
                total:
                  type: integer
                  example: 100
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
  '400':
    $ref: '../../components/responses/400.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
