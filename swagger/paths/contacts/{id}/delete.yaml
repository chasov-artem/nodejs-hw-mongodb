tags:
  - Contacts
summary: Delete a contact
description: Delete a contact by its ID.
operationId: deleteContact
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    schema:
      type: string
      format: uuid
      example: '65ca67e7ae7f10c188b598384'
    required: true
    description: The unique identifier of the contact to delete.
responses:
  '204':
    description: Contact successfully deleted
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 204
            message:
              type: string
              example: Contact successfully deleted
            data:
              type: object
              example: {}
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found
            data:
              type: object
              example: {}
  '401':
    $ref: '../../../components/responses/401.yaml'
  '500':
    $ref: '../../../components/responses/500.yaml'
